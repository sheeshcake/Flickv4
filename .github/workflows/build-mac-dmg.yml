# Mac Catalyst DMG. Required repository secrets:
#   EXPO_PUBLIC_TMDB_API_KEY
#   EXPO_PUBLIC_WYZIE_API_KEY
# Optional:
#   EXPO_PUBLIC_WATCH_PARTY_URL
#   MACOS_CODESIGN_IDENTITY  (Developer ID / Apple Development; ad-hoc if unset)

name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: APP_VERSION (e.g. 2.3.3). Empty uses .env.example.
        required: false
        type: string
      android_version_code:
        description: ANDROID_VERSION_CODE. Empty is derived from APP_VERSION.
        required: false
        type: string

concurrency:
  group: build-mac-dmg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    name: macOS DMG
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          APP_VERSION_INPUT: ${{ github.event.inputs.app_version || '' }}
          ANDROID_VERSION_CODE_INPUT: ${{ github.event.inputs.android_version_code || '' }}
        run: |
          set -euo pipefail
          version_code() {
            local raw="${1#v}"
            local major=0 minor=0 patch=0
            IFS='.' read -r major minor patch _ <<< "${raw}.0.0"
            echo $((major * 10000 + minor * 100 + patch))
          }
          VERSION="${APP_VERSION_INPUT}"
          CODE="${ANDROID_VERSION_CODE_INPUT}"
          EXAMPLE_VERSION=$(grep -E '^APP_VERSION=' .env.example | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            VERSION="${EXAMPLE_VERSION:-0.0.1}"
          fi
          if [ -z "$CODE" ]; then
            CODE="$(version_code "$VERSION")"
          fi
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flick
        uses: ./.github/actions/setup-flick
        with:
          app_version: ${{ steps.version.outputs.app_version }}
          android_version_code: ${{ steps.version.outputs.android_version_code }}
          tmdb_api_key: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
          wyzie_api_key: ${{ secrets.EXPO_PUBLIC_WYZIE_API_KEY }}
          watch_party_url: ${{ secrets.EXPO_PUBLIC_WATCH_PARTY_URL }}

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod install --project-directory=ios

      - name: Package Catalyst DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: bash macos/package-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Flick-${{ steps.version.outputs.app_version }}-macos
          path: build/macos/Flick-${{ steps.version.outputs.app_version }}.dmg
          if-no-files-found: error
