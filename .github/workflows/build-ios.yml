name: Build iOS IPA
on: workflow_dispatch

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout 2.3.1 Release
        uses: actions/checkout@v4
        with:
          repository: 'sheeshcake/Flickv4'
          ref: '2.3.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure Xcode Node Environment & TMDB Keys
        run: |
          # 1. Point Xcode's build script directly to the active Node binary
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

          # 2. Write the .env file for Expo bundler
          cat << 'EOF' > .env
          EXPO_PUBLIC_TMDB_API_KEY=10116fa302c8fe0c2cbc38be17aa65a5
          EXPO_PUBLIC_TMDB_BASE_URL=https://api.themoviedb.org/3
          EXPO_PUBLIC_TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxMDExNmZhMzAyYzhmZTBjMmNiYzM4YmUxN2FhNjVhNSIsIm5iZiI6MTc4NzE0MjkzMy4wNiwic3ViamVjdCI6IjZkNWEzMTU0NmQzN2ZlMzYxNjc0NDEzIiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9.nHY8A-KhX4-MefoFpq7Wy32K5EVdn9uTsYkCfkcCi_I
          EXPO_PUBLIC_WYZIE_BASE_URL=https://sub.wyzie.io
          EXPO_PUBLIC_WYZIE_API_KEY=
          EXPO_PUBLIC_SAMPLE_VIDEO_URL=https://media.w3.org/2010/05/sintel/trailer.mp4
          EXPO_PUBLIC_WATCH_PARTY_URL=
          TMDB_API_KEY=10116fa302c8fe0c2cbc38be17aa65a5
          APP_VERSION=2.3.1
          ANDROID_VERSION_CODE=20301
          EOF

          # 3. Safely inject the TMDB key directly into src/config/env.ts using Node.js
          node -e '
            const fs = require("fs");
            const file = "src/config/env.ts";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_API_KEY(\s*\|\|\s*["'"'"'"].*?["'"'"'"])?/g, "\"10116fa302c8fe0c2cbc38be17aa65a5\"");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_BASE_URL(\s*\|\|\s*["'"'"'"].*?["'"'"'"])?/g, "\"https://api.themoviedb.org/3\"");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_IMAGE_BASE_URL(\s*\|\|\s*["'"'"'"].*?["'"'"'"])?/g, "\"https://image.tmdb.org/t/p/w500\"");
              fs.writeFileSync(file, content, "utf8");
            }
          '

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Fix MMKV and Install CocoaPods
        run: |
          cd ios
          rm -f Podfile.lock
          if ! grep -q "pod 'MMKV', '2.3.0'" Podfile; then
            sed -i '' '/target '\''Flick'\'' do/a\
              pod '\''MMKV'\'', '\''2.3.0'\''\
              pod '\''MMKVCore'\'', '\''2.3.0'\''
            ' Podfile
          fi
          pod install --repo-update

      - name: Build Xcode Archive
        run: |
          cd ios
          xcodebuild -workspace Flick.xcworkspace \
            -scheme Flick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Flick.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Flick.xcarchive/Products/Applications/*.app Payload/
          zip -r Flickv4-2.3.1.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flickv4-2.3.1-IPA
          path: ios/Flickv4-2.3.1.ipa
