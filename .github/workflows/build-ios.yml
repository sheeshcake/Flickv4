name: Build iOS IPA
on: workflow_dispatch

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Environment File (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "EXPO_PUBLIC_TMDB_API_URL=https://api.themoviedb.org/3" >> .env
          fi

      - name: Install Dependencies
        run: npm install

      - name: Expo Prebuild (No Pods)
        run: npx expo prebuild --platform ios --no-install

      - name: Fix MMKV CocoaPods Dependency
        run: |
          cd ios
          sed -i '' '/target '\''Flick'\'' do/a\
            pod '\''MMKV'\'', '\''2.3.0'\''\
            pod '\''MMKVCore'\'', '\''2.3.0'\''
          ' Podfile
          pod install

      - name: Build Xcode Archive
        run: |
          cd ios
          xcodebuild -workspace Flick.xcworkspace \
            -scheme Flick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Flick.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Flick.xcarchive/Products/Applications/*.app Payload/
          zip -r Flickv4.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flickv4-IPA
          path: ios/Flickv4.ipa
